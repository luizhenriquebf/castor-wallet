appId: br.com.castorwallet.desktop
productName: Castor Wallet
publish:
  provider: github
  owner: luizhenriquebf
  repo: castor-wallet
  releaseType: release
directories:
  output: release
files:
  - dist/**/*
  - desktop/*.mjs
  - desktop/*.cjs
  - desktop/icon.ico
  - mime.mjs
win:
  icon: desktop/icon.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  artifactName: Castor-Wallet-Setup.exe
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  shortcutName: Castor Wallet
